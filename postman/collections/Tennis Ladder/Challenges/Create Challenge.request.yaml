$kind: http-request
url: "{{baseUrl}}/api/challenges"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "ladder": {
        "id": {{ladderId}}
      },
      "challengerEntry": {
        "id": {{challengerEntryId}}
      },
      "challengedEntry": {
        "id": {{challengedEntryId}}
      },
      "status": "pending",
      "message": "Want to play this week?"
    }
order: 1000
